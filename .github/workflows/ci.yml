name: ci

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - run: for f in .claude-plugin/*.json .mcp.json; do jq empty "$f"; done
            - run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate --strict .
            - run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate --strict .claude-plugin/plugin.json
